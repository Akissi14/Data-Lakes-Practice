[project]
name = "data-lakes-tp1"
version = "0.1.0"
description = "TP 1 - Introduction aux Pipelines de Données avec Data Lakes (Pfam)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Yvann Vincent" }
]

dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.24"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "jupyter",
    "notebook",
    "matplotlib",
    "seaborn"
]
